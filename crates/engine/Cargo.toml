[package]
name = "autoflow_engine"
description = "AutoFlow flow executor: schema, safe expression language, interpreter and the Windows input backend."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "autoflow_engine"
path = "src/lib.rs"

[features]
default = ["net"]
# Real HTTP for `http` steps (ureq + rustls). Without it, http steps fail with an "environment" error.
net = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
ryu-js = "1"
ureq = { version = "3", optional = true, default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
