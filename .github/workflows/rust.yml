# Rust checks for the native side: autoflow_engine (all platforms) and the Tauri desktop shell (Windows).
name: rust

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "packages/core/fixtures/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "packages/core/fixtures/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  engine:
    name: Engine (fmt, clippy, test) on Ubuntu
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy (engine)
        run: cargo clippy -p autoflow_engine --all-targets -- -D warnings
      - name: cargo test (engine, shared fixtures)
        run: cargo test -p autoflow_engine

  windows:
    name: Engine tests + desktop check on Windows
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Organization runners (home: 부산집업무용, 부산집업무용-2 / office: FELIXLEE, FELIXLEE-2), Windows service, no desktop.
    runs-on: [self-hosted, Windows]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on the runner (cargo target dirs when below 12 GB)
        shell: powershell
        run: |
          $drive = (Get-Item $env:GITHUB_WORKSPACE).PSDrive.Name
          $free = (Get-PSDrive $drive).Free / 1GB
          Write-Host ("free on ${drive}: {0:N1} GB" -f $free)
          if ($free -lt 12) {
            $work = Split-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) -Parent
            Get-ChildItem $work -Directory | ForEach-Object {
              Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                $t = Join-Path $_.FullName 'target'
                if ((Test-Path $t) -and ($t -ne (Join-Path $env:GITHUB_WORKSPACE 'target'))) { Write-Host "removing $t"; Remove-Item -Recurse -Force $t -ErrorAction SilentlyContinue }
              }
            }
            Get-ChildItem (Join-Path $work '_temp') -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -lt (Get-Date).AddDays(-1) } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            $free = (Get-PSDrive $drive).Free / 1GB
            Write-Host ("after cleanup: {0:N1} GB" -f $free)
          }
          if ($free -lt 6) { throw "less than 6 GB free on ${drive}: - clean the runner PC (see CLAUDE.md)" }
      - name: Rust toolchain (rustup if missing)
        # Self-hosted runners: install rustup once if absent; stable + clippy are kept up to date.
        shell: powershell
        run: |
          # rustup honours CARGO_HOME (some PCs set it machine-wide, e.g. C:\Rust\cargo); otherwise it is per account.
          # A runner service without CARGO_HOME (new office PCs) still finds the machine-wide install.
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } elseif (Test-Path 'C:\Rust\cargo\bin\rustup.exe') { 'C:\Rust\cargo' } else { Join-Path $env:USERPROFILE '.cargo' }
          $cargoBin = Join-Path $cargoHome 'bin'
          Write-Host "CARGO_HOME=$cargoHome (rustup present: $(Test-Path (Join-Path $cargoBin 'rustup.exe')))"
          [IO.File]::AppendAllText($env:GITHUB_ENV, "CARGO_HOME=$cargoHome`n")
          if (-not (Test-Path (Join-Path $cargoBin 'rustup.exe'))) {
            # First run on this PC: install rustup into CARGO_HOME (curl.exe ships with Windows 10+; errors are printed).
            $init = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Write-Host "rustup missing - downloading rustup-init to $init"
            & curl.exe -fsSL --retry 3 -o $init https://win.rustup.rs/x86_64 2>&1 | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $init)) { throw "could not download rustup-init (curl exit $LASTEXITCODE)" }
            $env:CARGO_HOME = $cargoHome
            $env:RUSTUP_HOME = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path (Split-Path $cargoHome -Parent) 'rustup' }
            [IO.File]::AppendAllText($env:GITHUB_ENV, "RUSTUP_HOME=$($env:RUSTUP_HOME)`n")
            & $init -y --no-modify-path --default-toolchain stable --profile minimal 2>&1 | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -ne 0) { throw "rustup-init failed with exit code $LASTEXITCODE" }
          }
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$cargoBin`n")
          & (Join-Path $cargoBin 'rustup.exe') toolchain install stable --profile minimal --component clippy --target x86_64-pc-windows-msvc 2>&1 | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw \"rustup toolchain install failed with exit code $LASTEXITCODE\" }
      - name: Stub frontend for generate_context!
        # apps/web/dist is built by the web pipeline; the type check only needs an index.html.
        shell: powershell
        run: |
          $stub = Join-Path $env:RUNNER_TEMP 'stub-dist'
          New-Item -ItemType Directory -Force -Path $stub | Out-Null
          '<!doctype html><title>stub</title>' | Set-Content -Encoding ascii (Join-Path $stub 'index.html')
          $cfg = @{ build = @{ frontendDist = $stub } } | ConvertTo-Json -Compress
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TAURI_CONFIG=$cfg`n")
      - name: cargo test (engine)
        # windows_smoke needs an interactive desktop (clipboard, screen, hotkeys): skipped on the service runners.
        shell: powershell
        run: |
          if ('${{ runner.environment }}' -eq 'self-hosted') {
            cargo test -p autoflow_engine --lib --test conformance --test displays --test engine --test expr --test fixtures
          } else {
            cargo test -p autoflow_engine
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: cargo clippy (engine + desktop, Windows)
        run: cargo clippy -p autoflow_engine -p autoflow-desktop --all-targets -- -D warnings
      - name: cargo check (desktop)
        run: cargo check -p autoflow-desktop
