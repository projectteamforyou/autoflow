name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-web:
    name: Core & web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Core — build, typecheck, test
        run: |
          pnpm --filter @autoflow/core build
          pnpm --filter @autoflow/core typecheck
          pnpm --filter @autoflow/core test
      - name: Fixtures are up to date
        run: git diff --exit-code packages/core/fixtures
      - name: Web — i18n gate
        run: pnpm --filter @autoflow/web i18n:check
      - name: Web — typecheck & build
        run: pnpm --filter @autoflow/web build
      - name: Web — Chromium smoke test
        run: |
          npx playwright install --with-deps chromium
          CHROME_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())" 2>/dev/null || true) node apps/web/scripts/smoke.mjs
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
