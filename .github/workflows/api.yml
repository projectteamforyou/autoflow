name: API

on:
  push:
    paths:
      - "apps/api/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/api.yml"

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build @autoflow/core
        run: pnpm --filter @autoflow/core build

      - name: Typecheck API
        run: pnpm --filter @autoflow/api typecheck

      - name: Test API (real PostgreSQL)
        run: pnpm --filter @autoflow/api test

      - name: Build API
        run: pnpm --filter @autoflow/api build

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (context = repo root)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: autoflow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
