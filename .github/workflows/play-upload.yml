name: Play upload (no rebuild)
# Reuses the signed AAB from an earlier "Android build" run (its artifact), so no Android rebuild and almost no
# Actions minutes. Two modes (scripts/play/publish.mjs):
#   upload — put the bundle on Play without a track (makes a new permission's Console declaration section appear)
#   submit — release a bundle that is already on Play (by version code) to a track
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'upload = bundle only from an artifact · submit = release an uploaded version code to a track'
        type: choice
        options: [upload, submit]
        default: upload
      run_id:
        description: 'upload: the Android build run id whose artifact holds the signed AAB'
        type: string
        default: ''
      artifact:
        description: 'upload: artifact name (e.g. autoflow-android-1.1.3-17)'
        type: string
        default: ''
      version_code:
        description: 'submit: version code already on Play (empty = highest)'
        type: string
        default: ''
      track:
        description: 'submit: Play track'
        type: choice
        options: [internal, alpha, beta, production]
        default: production
      status:
        description: 'submit: release status'
        type: choice
        options: [completed, draft, inProgress, halted]
        default: completed
      release_name:
        description: 'submit: release name shown in Console (e.g. "1.1.3 (17)")'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: play-upload
  cancel-in-progress: true
jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download the signed AAB
        if: inputs.mode == 'upload'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: aab
      - name: Upload bundle to Play (no track)
        if: inputs.mode == 'upload'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          AAB=$(find aab -name '*.aab' | head -1)
          [ -n "$AAB" ] || { echo "::error::no .aab in artifact ${{ inputs.artifact }}"; exit 1; }
          echo "bundle: $AAB ($(wc -c < "$AAB") bytes)"
          node scripts/play/publish.mjs --package com.projectteamforyou.autoflow --upload-only --aab "$AAB"
      - name: Release an uploaded version code
        if: inputs.mode == 'submit'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          ARGS="--track ${{ inputs.track }} --status ${{ inputs.status }}"
          [ -z "${{ inputs.version_code }}" ] || ARGS="$ARGS --version-code ${{ inputs.version_code }}"
          node scripts/play/publish.mjs --package com.projectteamforyou.autoflow --submit $ARGS
