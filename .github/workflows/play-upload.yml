name: Play upload (no rebuild)
# Reuses the signed AAB from an earlier "Android build" run (its artifact), so no Android rebuild. Two modes
# (scripts/play/publish.mjs):
#   upload — put the bundle on Play without a track (makes a new permission's Console declaration section appear)
#   submit — release a bundle that is already on Play (by version code) to a track
# Runs on the org's self-hosted Windows runners by default (free — a hosted run bills a full minute even for these
# 15 seconds, and an hourly "is the declaration approved yet?" retry would eat ~720 of the 2,000 monthly minutes).
# Every `run:` step is a single `node …` command, so it is identical under PowerShell 5 (self-hosted) and bash (hosted).
# If every runner PC is off the job just waits (no minutes spent); pick runner=hosted when it must run right now.
# Exit code 3 = Play refused the edit because the Console declaration is missing or still under Google review — not a
# code problem, run again after the review (the job leaves a notice and a step summary saying so).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'upload = bundle only from an artifact · submit = release an uploaded version code to a track'
        type: choice
        options: [upload, submit]
        default: upload
      run_id:
        description: 'upload: the Android build run id whose artifact holds the signed AAB'
        type: string
        default: ''
      artifact:
        description: 'upload: artifact name (e.g. autoflow-android-1.1.3-17)'
        type: string
        default: ''
      version_code:
        description: 'submit: version code already on Play (empty = highest)'
        type: string
        default: ''
      track:
        description: 'submit: Play track'
        type: choice
        options: [internal, alpha, beta, production]
        default: production
      status:
        description: 'submit: release status'
        type: choice
        options: [completed, draft, inProgress, halted]
        default: completed
      release_name:
        description: 'submit: release name shown in Console (e.g. "1.1.3 (17)")'
        type: string
        default: ''
      runner:
        description: 'self-hosted = org Windows runner (free) · hosted = ubuntu-24.04 (bills 1 minute per run)'
        type: choice
        options: [self-hosted, hosted]
        default: self-hosted
permissions:
  contents: read
  actions: read
concurrency:
  group: play-upload
  cancel-in-progress: true
jobs:
  play:
    runs-on: ${{ inputs.runner == 'hosted' && 'ubuntu-24.04' || fromJSON('["self-hosted","Windows"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.runner == 'hosted' # the self-hosted runners already have Node LTS on PATH
        with:
          node-version: 22
      - name: Node on this runner
        run: node --version
      - name: Download the signed AAB
        if: inputs.mode == 'upload'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: aab
      - name: Upload bundle to Play (no track)
        if: inputs.mode == 'upload'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        # --aab-dir finds the one .aab in the downloaded artifact (the script refuses 0 or several)
        run: node scripts/play/publish.mjs --package com.projectteamforyou.autoflow --upload-only --aab-dir aab
      - name: Release an uploaded version code
        if: inputs.mode == 'submit'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_NAME: ${{ inputs.release_name }}
        # --version-code stays last: an empty value (= highest version code on Play) is simply absent to the script
        run: node scripts/play/publish.mjs --package com.projectteamforyou.autoflow --submit --track ${{ inputs.track }} --status ${{ inputs.status }} --version-code ${{ inputs.version_code }}
