<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Google Play feature graphic, 1024×500 (scripts/store/screens.mjs). Key content stays inside the centre safe area. -->
<style>
/*__TOKENS__*/
* { box-sizing: border-box; }
html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
body { font-family: var(--font-stack), var(--af-font); color: #fff; position: relative;
  background: radial-gradient(70% 90% at 0% 0%, rgba(124,92,255,.55), transparent 60%),
              radial-gradient(60% 80% at 100% 100%, rgba(34,195,166,.40), transparent 60%),
              linear-gradient(120deg, #0B0B1A 0%, #14143A 100%); }
.flow { position: absolute; left: 0; top: 0; width: 1024px; height: 500px; opacity: .55; }
.txt { position: absolute; left: 64px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 18px; }
.brand img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
h1 { margin: 0; font-size: 84px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
p { margin: 0; font-size: 32px; font-weight: 600; line-height: 1.25; color: #DCD6FF; text-wrap: balance; word-break: keep-all; }
.chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.chips span { font-size: 20px; font-weight: 700; padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); }
.phone { position: absolute; right: 70px; top: 46px; width: 250px; height: 500px; border-radius: 40px; background: #05050F; padding: 10px; transform: rotate(-6deg);
  box-shadow: 0 30px 60px rgba(0,0,0,.55), inset 0 0 0 3px rgba(255,255,255,.1); }
.phone .scr { width: 100%; height: 100%; border-radius: 30px; background: linear-gradient(160deg, #1B1B36, #0F0F22); position: relative; overflow: hidden; }
.tgt { position: absolute; width: 58px; height: 58px; border-radius: 50%; border: 4px solid #22C3A6; box-shadow: 0 0 0 14px rgba(34,195,166,.18), 0 0 40px rgba(34,195,166,.7); }
.halt { position: absolute; right: 14px; top: 150px; width: 54px; height: 54px; border-radius: 50%; background: #EF4444; border: 3px solid #fff; display: grid; place-items: center; font-size: 20px; }
.bar { position: absolute; left: 18px; right: 18px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.08); }
</style>
</head>
<body>
<svg class="flow" viewBox="0 0 1024 500"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22C3A6"/></linearGradient></defs>
  <path d="M-20 430 C 220 430, 300 120, 520 140 S 820 460, 1060 300" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round"/></svg>
<div class="txt">
  <div class="brand"><img id="mark" alt=""><h1 id="t"></h1></div>
  <p id="s"></p>
  <div class="chips" id="chips"></div>
</div>
<div class="phone"><div class="scr">
  <div class="bar" style="top:40px;right:90px"></div><div class="bar" style="top:70px"></div><div class="bar" style="top:100px;right:60px"></div>
  <div class="tgt" style="left:96px;top:290px"></div><div class="halt">■</div>
</div></div>
<script>
(() => {
const D = window.__DATA;
document.documentElement.lang = D.lang;
document.documentElement.dataset.theme = 'dark';
document.body.style.setProperty('--font-stack', D.fontStack);
document.getElementById('mark').src = D.mark;
const h = document.getElementById('t');
h.textContent = D.caption.title;
document.getElementById('s').textContent = D.caption.tagline;
document.getElementById('chips').innerHTML = D.chips.map((c) => `<span>${c}</span>`).join('');
let fs = 84; while (fs > 44 && h.scrollWidth > 440) { fs -= 2; h.style.fontSize = fs + 'px'; }
const p = document.getElementById('s'); let ps = 32; while (ps > 20 && p.scrollHeight > ps * 1.25 * 2 + 2) { ps -= 1; p.style.fontSize = ps + 'px'; }
window.__ready = true;
})();
</script>
</body>
</html>
