[package]
name = "autoflow-desktop"
description = "AutoFlow for Windows — Tauri 2 shell around the AutoFlow web app with the native Rust executor."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
default-run = "autoflow-desktop"

[lib]
name = "autoflow_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "autoflow-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
autoflow_engine = { path = "../../../crates/engine" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[features]
# Passed by `tauri build` / `tauri dev`; keeps the custom-protocol switch explicit.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
